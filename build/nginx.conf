# SLOT 摄影师后台 — 前端 Nginx 配置
# 生产环境：前端与后端分离部署，/api 转发到后端服务
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 后台需上传作品图片（作品集封面 / 图集），上限与后端 upload.max_size_mb 对齐
    # （config/nacos 里 prod = 100、dev = 20；此处取 prod 口径）。
    # 不设此项则 nginx 默认 1M —— 手机原图动辄 3~8M，上传必 413（与 h5 / wechat 两站点保持一致）。
    client_max_body_size 100m;

    # 静态资源带缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端 API 反向代理（docker-compose 内服务名为 backend）
    # 前端请求 /api/xxx → 后端接收 /xxx（后端路由在根路径）
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # 公开媒体（作品集封面/图集）：后端不鉴权目录，直连转发、**不剥前缀**
    # 不配这条的话 /media/xxx 会落到下方 SPA 回退 → 返回 index.html，
    # 表现是"图片地址在但打不开"
    location /media/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
